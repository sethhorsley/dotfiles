source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

# Forward extended key sequences (e.g. Ctrl+.) to applications inside tmux
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Encode extended keys as CSI u (what Pi/nvim expect) instead of xterm modifyOtherKeys
set -g extended-keys-format csi-u

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g mouse on
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g window-style 'fg=#6c7086,bg=#11111b'  # inactive panes: dim text, darker bg
set -g window-active-style 'fg=#cdd6f4,bg=#1e1e2e'  # explicit: 'default' inherits window-style
set -g pane-border-lines heavy
set -g pane-border-indicators both

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin "christoomey/vim-tmux-navigator" # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set-option -g @pane_resize "2"

set -g @plugin 'tmux-plugins/tmux-open'

# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux' # My fork that holds the meetings script bc I'm lazy af
set -g @plugin "tmux-plugins/tmux-resurrect"

set -g @plugin "omerxx/tmux-sessionx"
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-git-branch 'on'

# set -g @continuum-restore 'on'
# set -g @resurrect-strategy-nvim 'session'
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator "#{?window_active,#[fg=#c28d6e],#[fg=#6d8dc4]}#[bg=#1e1e2e] "  # round cap; fg pre-blended to match the 75%-translucent number cell (75% of #fab387/#89b4fa over a dark backdrop)
set -g @catppuccin_window_middle_separator " #{?window_active,#[bg=#fab387],#[bg=#89b4fa]} "  # bg-colored space (not a █ glyph) so it matches the translucent number cell
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"

run 'tpack init'

# session module with caps pre-blended to match the 75%-translucent cells (a glyph is opaque, a bg is not)
set -g status-left "#[fg=#{?client_prefix,#bd6f87,#83b181},bg=#1e1e2e,nobold,nounderscore,noitalics] #[fg=#1e1e2e,bg=#{?client_prefix,#f38ba8,#a6e3a1},nobold,nounderscore,noitalics] #[fg=#cdd6f4,bg=#313244] #S#[fg=#2b2c3b,bg=#1e1e2e,nobold,nounderscore,noitalics] "

# Override tmux-pain-control's comma binding to use it for renaming windows
unbind-key -T prefix ","
bind-key "," command-prompt -I "#W" "rename-window -- '%%'"

bind-key "o" run-shell "~/.config/tmux/scripts/sesh-or-worktree.sh '#{pane_current_path}'"

# single-click a URL to open it in shells (drag-select unaffected; click-to-focus kept);
# in full-screen apps (nvim, less, fzf...) pass the click through instead of hunting URLs
bind -n MouseUp1Pane if -F "#{alternate_on}" "send-keys -M" "run-shell -b \"$HOME/.config/tmux/scripts/open-url.sh '#{pane_id}' '#{mouse_y}'\""

# prefix + l clears the screen like a normal Ctrl+L (vim-tmux-navigator owns bare C-l)
bind l send-keys C-l

bind-key "m" resize-pane -Z
bind-key "<" swap-window -t -1 -d
bind-key ">" swap-window -t +1 -d
bind-key "S" swap-pane -D


# tpack's default prefix+I runs `tui --install`, which exits instantly when nothing is missing; open the full TUI instead
bind-key I display-popup -E -w 80 -h 25 "tpack tui"
